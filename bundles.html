<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Homey Cafe — Bundle Sets</title>

    <meta name="description"
          content="Homey Cafe frozen meal bundle sets. Choose 3 meals for RM60.">

    <link rel="stylesheet" href="style.css">
</head>

<body>

<header class="site-header">

    <div class="container nav">

        <a class="brand" href="index.html">
            <img src="homey-logo.png" alt="Homey Cafe">
        </a>

        <a class="cart-link" href="checkout.html">
            Cart <b id="cart-count">0</b>
        </a>

    </div>

</header>


<main>

<section class="bundle-hero container">

    <p class="eyebrow">BUNDLE SETS</p>

    <h1>
        Three meals,<br>
        <em>one easy bundle.</em>
    </h1>

    <p>
        Choose from our ready-made meal combinations.
        Each bundle contains 3 meal sets for just RM60.
    </p>

</section>


<section class="bundle-section">

    <div class="container">

        <div class="section-heading">

            <div>
                <p class="eyebrow">CHOOSE YOUR BUNDLE</p>
                <h2>Bundle Sets</h2>
            </div>

            <p>3 meal sets · RM60</p>

        </div>


        <div id="bundle-grid" class="bundle-grid"></div>

    </div>

</section>

</main>


<footer>

    <div class="container footer-inner">

        <div>
            <strong>Homey cafe</strong>
            <span>Restaurant in your fridge.</span>
        </div>

        <a class="secondary-btn" href="index.html">
            Back to Menu
        </a>

    </div>

</footer>


<script src="script.js"></script>

</body>
</html>
